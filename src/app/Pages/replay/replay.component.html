<div class="container-fluid">
  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>
  <div class="d-flex p-3 pt-2 pb-2 mb-1" style="background-color: rgba(7, 0, 61, var(--tw-bg-opacity, 1)); color: #fff;">
    <a class="nav-link fs-5"  routerLink="/layout"><i class="bi bi-card-list"></i>&nbsp;Challenges</a>&nbsp;<span class="pt-1"><i class="bi bi-arrow-left text-white"></i></span>&nbsp;<span> <p class="fs-5 mb-0"><i class="bi bi-card-checklist"></i>&nbsp;Reply</p></span>
  </div> 

  <!-- Challenge Card -->
  <div *ngIf="challenge && !isLoading" class="card shadow-lg">
    <div class="card-header  text-white d-flex justify-content-between align-items-center"
    style=" background-color: rgba(7, 0, 61, var(--tw-bg-opacity, 1));">
      <h4 class="py-2 m-0 fs-3">{{ challenge.title }}</h4>
      <p class="fs-6 mb-0">Created by&nbsp;:&nbsp;{{ challenge.createdBy }}</p>
    </div>
    <div class="card-body">
      <p class="card-text">
        <strong class="fs-4">Description:</strong>
      </p>
      <pre class="bg-light p-3 border rounded"><code>{{ challenge.description }}</code></pre>
    </div>
    <!-- Extract and Display Only the File Name -->
    <div *ngIf="challenge.filepath">
  <a [href]="challenge.filepath" target="_blank" download (click)="downloadFile()">
    <i class="bi bi-download"></i> {{ challenge.filepath }}
  </a>
</div>


    <div class="card-footer py-1">
      <a routerLink="/layout"><i class="bi bi-box-arrow-left fs-4 text-danger"></i></a>
      <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
      <button class="btn btn-sm btn-outline-primary" (click)="toggleReplyBox()"><i class="bi bi-reply-fill"></i>&nbsp;&nbsp;Reply</button>
    </div>
  </div>

  <!-- Comment Box (Shown when Reply button is clicked, inside a separate card) -->
  <div *ngIf="showReplyBox" class="card shadow-lg mt-3">
    <div class="card-header bg-light">
      <h5>Write Your Reply</h5>
    </div>
    <div class="card-body"> 
      <textarea 
        [(ngModel)]="replyText" 
        class="form-control" 
        placeholder="Please Provide the solution here......" 
        rows="3" 
        style="width: 100%;"
        required>
      </textarea>
      <button 
        class="btn btn-sm btn-success float-start mt-3" 
        (click)="submitReply()">
        Submit Reply
      </button>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header mb-0 py-2 text-white" style="background-color: rgba(7, 0, 61, var(--tw-bg-opacity, 1));">
      <h4 class="m-0">Replies...</h4>
    </div>
    <div class="card-body">
      <div *ngIf="replays.length === 0" class="text-muted">No replies yet.</div>
    
      <div *ngFor="let reply of replays" class="mb-3">
        <div class="border p-3 rounded shadow-sm">
          <p class="mb-1">
            <strong>Replied by: </strong><span>{{ reply.repliedBy }}</span>
          </p>
    
          <!-- Accepted Reply Symbol -->
          <span *ngIf="reply.isAccepted" class="text-success fw-bold">✔ Accepted</span>
    
          <textarea *ngIf="reply.isEditing" [(ngModel)]="reply.editedText" rows="2" class="form-control"></textarea>
          <pre *ngIf="!reply.isEditing" class="bg-light p-3 border rounded">{{ reply.content }}</pre>
    
          <!-- Action Buttons -->
          <div class="d-flex justify-content-between align-items-center">
            <!-- Left: Edit & Delete Buttons -->
            <div *ngIf = 'reply.repliedBy === currentUser'>
              <button *ngIf="!reply.isEditing" class="btn btn-sm btn-primary me-2" (click)="editReply(reply)">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button *ngIf="!reply.isEditing" class="btn btn-sm btn-danger" (click)="deleteReply(reply.id)">
                <i class="bi bi-trash"></i>
              </button>
              <div class="mt-2">
                <button *ngIf="reply.isEditing" class="btn btn-sm btn-success me-2" (click)="saveEditedReply(reply)">
                  <i class="bi bi-check-circle"></i>
                </button>
                <button *ngIf="reply.isEditing" class="btn btn-sm btn-secondary" (click)="cancelEdit(reply)">
                  <i class="bi bi-x-circle"></i>
                </button>
              </div>
            </div>
    
            <!-- Right: Accept Reply & Reply Button -->
            <div>
              <button  
                class="btn btn-outline-success me-2" (click)="markAsAccepted(reply)">
                <i class="bi bi-check-lg"></i> Accept
              </button>
    
              <button class="btn btn-outline-primary" (click)="toggleReplyToReply(reply)">
                <i class="bi bi-reply-fill"></i> 
              </button>
            </div>
          </div>
    
          <!-- Reply Box (Only Shown When Replying) -->
          <div *ngIf="reply.showReplyBox" class="mt-2">
            <textarea [(ngModel)]="reply.replyText" class="form-control" rows="2" placeholder="Write a reply..."></textarea>
            <button class="btn btn-sm btn-success mt-2" (click)="submitReplyToReply(reply)">
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
</div>
